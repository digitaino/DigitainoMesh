<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshCore Community Map</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Load app.js first so initMapKit is defined before MapKit fires its callback -->
    <script src="app.js"></script>
    <script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.core.js"
            crossorigin async
            data-callback="initMapKit"
            data-libraries="map,annotations,overlays"></script>
</head>
<body>
    <div id="map"></div>

    <div id="stats-panel">
        <h2>MeshCore Community Map</h2>
        <div class="stats-grid">
            <div class="stat">
                <span class="stat-value" id="stat-cells">&mdash;</span>
                <span class="stat-label">Cells Mapped</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-uploads">&mdash;</span>
                <span class="stat-label">Uploads</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-repeaters">&mdash;</span>
                <span class="stat-label">Repeaters</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-contributors">&mdash;</span>
                <span class="stat-label">Contributors</span>
            </div>
        </div>
        <div class="stat-footer" id="stat-last-upload"></div>

        <div class="filter-bar">
            <h3>Coverage</h3>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all" onclick="applyCoverageFilter('all')">All</button>
                <button class="filter-btn" data-filter="active" onclick="applyCoverageFilter('active')">Active</button>
                <button class="filter-btn" data-filter="passive" onclick="applyCoverageFilter('passive')">Passive</button>
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-header">
                <h3>Repeater</h3>
                <span class="filter-count" id="repeater-count"></span>
            </div>
            <select id="repeater-select" class="repeater-select" onchange="applyRepeaterFilter(this.value)">
                <option value="">All Repeaters</option>
            </select>
        </div>

        <div class="legend">
            <h3>Signal Quality (SNR)</h3>
            <div class="legend-item"><span class="legend-color" style="background: #22c55e;"></span> Excellent (&gt;10 dB)</div>
            <div class="legend-item"><span class="legend-color" style="background: #eab308;"></span> Good (&gt;5 dB)</div>
            <div class="legend-item"><span class="legend-color" style="background: #f97316;"></span> Fair (&gt;0 dB)</div>
            <div class="legend-item"><span class="legend-color" style="background: #ef4444;"></span> Poor (&gt;-10 dB)</div>
            <div class="legend-item"><span class="legend-color" style="background: #991b1b;"></span> Very Poor (&le;-10 dB)</div>
        </div>
    </div>
</body>
</html>
